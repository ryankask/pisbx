[package]
name = "pisbx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Run the pi coding agent inside a macOS Seatbelt sandbox via srt"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[profile.release]
lto = true
strip = true
